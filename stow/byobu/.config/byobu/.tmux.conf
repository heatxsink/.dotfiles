set -g base-index 1
setw -g pane-base-index 1
set-option -g mouse on
set -g default-command '/bin/bash --login'
# Every copy-pipe binding with no explicit command (mouse drag, double/triple
# click, y, Enter, M-w) pipes the selection here, i.e. to the (X11) clipboard.
set -s copy-command 'xsel -i --clipboard'
# Mouse selection copies on release but stays highlighted; q, Esc or a click clears it.
bind-key -Tcopy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear
bind-key -Tcopy-mode-vi MouseDown1Pane select-pane \; send -X clear-selection
# Selection colour. Keep hex lowercase: tmux expands formats in styles and #F is
# window_flags, so bg=#F... becomes an invalid colour and no highlight is drawn.
set -g mode-style 'bg=#ff1493,fg=#ffffff'
# Copy tmux buffer to the (X11) clipboard.
bind-key C-c run "tmux save-buffer - | xsel -i --clipboard"
# Copy (X11) clipboard to tmux buffer and paste in current pane.
bind-key C-v run "xsel -o --clipboard 2>/dev/null | tmux load-buffer - && tmux paste-buffer"
